name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r plan_app/requirements.txt pyinstaller

      - name: Build exe
        working-directory: plan_app
        run: pyinstaller app.spec --noconfirm

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: RaznestiUPD
          path: plan_app/dist/РазнестиУПД/РазнестиУПД.exe
          if-no-files-found: error
