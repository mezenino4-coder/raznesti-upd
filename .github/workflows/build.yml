name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r plan_app/requirements.txt pyinstaller

      - name: Build exe
        working-directory: plan_app
        run: pyinstaller app.spec --noconfirm

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 plan_app/dist/*.exe --title "Разнести УПД" --notes "Готовый exe для Windows (Python не нужен)."
